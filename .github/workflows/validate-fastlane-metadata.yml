# Validates the store metadata in fastlane/ (shared Fossify workflow).

name: Validate Fastlane Metadata

on:
  push:
    branches: [main]
    paths:
      - "fastlane/**"
  pull_request:
    branches: [main]
    paths:
      - "fastlane/**"

jobs:
  validate:
    uses: FossifyOrg/.github/.github/workflows/validate-fastlane-metadata.yml@main
