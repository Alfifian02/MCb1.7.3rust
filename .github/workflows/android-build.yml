name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "NDK version (empty = the version pinned in app/build.gradle.kts)"
        required: false
        default: ""
      pgo_mode:
        description: "PGO mode for the release build: auto (use pgo/recon.profdata if present), OFF or GENERATE"
        required: false
        default: "auto"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed only to publish GitHub Releases; pull requests from forks stay read-only.
    permissions:
      contents: write

    steps:
      - name: Checkout (core/ is part of this repository; rcheevos is a submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # rcheevos is pinned to v12.3.0 (see README). If the submodule pointer is
      # missing from this repository, fall back to cloning that exact tag.
      - name: Ensure rcheevos sources
        run: |
          if [ ! -f app/src/main/cpp/rcheevos/src/rc_client.c ]; then
            rm -rf app/src/main/cpp/rcheevos
            git clone --depth 1 --branch v12.3.0 \
              https://github.com/RetroAchievements/rcheevos.git app/src/main/cpp/rcheevos
          fi

      # core/third_party/CMakeLists.txt expects Lua 5.3.0 (lua/lua, tag v5.3.0) in
      # core/third_party/lua, a submodule pointer that is not part of this repository.
      - name: Ensure Lua sources
        run: |
          if [ ! -f core/third_party/lua/lapi.c ]; then
            rm -rf core/third_party/lua
            git clone --depth 1 --branch v5.3.0 \
              https://github.com/lua/lua.git core/third_party/lua
          fi
          test -f core/third_party/lua/lapi.c

      # gradle/gradle-daemon-jvm.properties requires toolchain 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # ubuntu-latest already ships the Android SDK with current cmdline-tools.
      # (android-actions/setup-android@v3 downloaded an older sdkmanager and failed
      # on the removed "tools" package, so it is not used.)
      - name: Install NDK, CMake and platform
        env:
          NDK_VERSION: ${{ github.event.inputs.ndk_version }}
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Versions come from app/build.gradle.kts (ndkVersion, cmake version, compileSdk).
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION:-25.2.9519653}" \
            "cmake;3.22.1"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The executable bit is lost when files are copied or committed from Windows or a zip.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SeedlessDS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build runs on pushes to main and on v* tags. It is signed with keystore/release.keystore
      # unless these optional secrets override it: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare release signing
        id: signing
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # No secrets: Gradle falls back to the committed keystore/release.keystore.
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "No signing secrets; signing with the committed keystore."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "MELONDS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=$KEY_ALIAS"
            echo "MELONDS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          NDK_VERSION: ${{ github.event.inputs.ndk_version }}
          PGO_MODE: ${{ github.event.inputs.pgo_mode }}
        run: |
          args=()
          if [ -n "$NDK_VERSION" ]; then args+=("-PndkVersion=$NDK_VERSION"); fi
          case "$PGO_MODE" in OFF|GENERATE) args+=("-PseedlessPgoMode=$PGO_MODE");; esac
          ./gradlew --no-daemon :app:assembleRelease "${args[@]}"

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SeedlessDS-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Pushing a tag v* publishes a Release (signed APK when secrets exist, otherwise the debug APK).
      # Every push to main refreshes the rolling pre-release "nightly" with the same files.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          shopt -s nullglob
          if [ "$SIGNED" = "true" ]; then
            files=(app/build/outputs/apk/release/*.apk)
          else
            files=(app/build/outputs/apk/debug/*.apk)
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "No APK to publish"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            # Recreate it so the tag moves to the commit that was just built.
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly "${files[@]}" --prerelease \
              --target "$GITHUB_SHA" --title "Nightly ${GITHUB_SHA::7}" \
              --notes "Automated build of $GITHUB_SHA. Signed: ${SIGNED:-false}."
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" local.properties
