name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (core/ is part of this repository; rcheevos is a submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # rcheevos is pinned to v12.3.0 (see README). If the submodule pointer is
      # missing from this repository, fall back to cloning that exact tag.
      - name: Ensure rcheevos sources
        run: |
          if [ ! -f app/src/main/cpp/rcheevos/src/rc_client.c ]; then
            rm -rf app/src/main/cpp/rcheevos
            git clone --depth 1 --branch v12.3.0 \
              https://github.com/RetroAchievements/rcheevos.git app/src/main/cpp/rcheevos
          fi

      # gradle/gradle-daemon-jvm.properties requires toolchain 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # ubuntu-latest already ships the Android SDK with current cmdline-tools.
      # (android-actions/setup-android@v3 downloaded an older sdkmanager and failed
      # on the removed "tools" package, so it is not used.)
      - name: Install NDK, CMake and platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Versions come from app/build.gradle.kts (ndkVersion, cmake version, compileSdk).
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # The executable bit is lost when files are copied or committed from Windows or a zip.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SeedlessDS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build runs only on pushes to main when signing secrets exist.
      # Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare release signing
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets; skipping release build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "MELONDS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=$KEY_ALIAS"
            echo "MELONDS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SeedlessDS-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" local.properties
