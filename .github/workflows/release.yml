# Builds signed APKs and publishes them to a GitHub Release. Nothing is uploaded to Google Play.
#
# Fully automatic: every time a NEW VERSION_NAME lands on main (gradle.properties changes), this
# workflow builds, signs and publishes release v<VERSION_NAME> and creates the tag for you.
# If the tag already exists (for example an unrelated edit to gradle.properties) it does nothing.
#
# How to release
#   Raise VERSION_NAME and VERSION_CODE in gradle.properties (for example 1.6.0 and 12) and commit
#   to main. That is all: the release is published automatically.
#   Release notes: the "## [<version>]" section of CHANGELOG.md if you added one, otherwise the
#   "## [Unreleased]" section, otherwise notes generated by GitHub.
#
# Manual run (Actions -> "Release" -> Run workflow, on main): builds and publishes the current
# VERSION_NAME. Use it to retry a failed release; the assets of an existing release are replaced.
#
# Signing: the keystore lives in the repository (release.jks + keystore.properties in the root
# folder). No repository secrets are needed. app/build.gradle.kts picks keystore.properties up
# automatically. Anyone who can read the repository can sign APKs with this key, so keep the
# repository private if that matters to you.
#
# IMPORTANT: Android only installs an update if it is signed with the SAME key as the installed
# version. Never replace release.jks, and keep a backup copy of it outside the repository.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "gradle.properties"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and release, upload the assets

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide whether to release
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [[ -z "$version" ]]; then
            echo "::error::VERSION_NAME is missing from gradle.properties."
            exit 1
          fi
          tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow on '$DEFAULT_BRANCH' (this run is on '$GITHUB_REF_NAME')."
            exit 1
          fi

          # Commit the tag points to (empty when the tag does not exist yet).
          tag_commit="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END { print $1 }')"

          if [[ -z "$tag_commit" || "$tag_commit" == "$GITHUB_SHA" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag."
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Never attach APKs built from this commit to a tag that points somewhere else.
            echo "::error::Tag '$tag' already exists on another commit ($tag_commit). Bump VERSION_NAME first."
            exit 1
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag '$tag' already exists, so there is nothing to release. Bump VERSION_NAME to publish a new version."
          fi

  release:
    name: Build and publish signed APKs
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check signing key
        run: |
          for file in keystore.properties release.jks; do
            if [[ ! -f "$file" ]]; then
              echo "::error::$file is missing from the repository root, so the APKs cannot be signed."
              exit 1
            fi
          done

      - name: Build release APKs
        # ABI_SPLITS=true builds one APK per CPU architecture plus a universal APK.
        run: |
          # The executable bit is lost when the repo is committed from some devices/zips.
          chmod +x ./gradlew
          ./gradlew assembleFossRelease -PABI_SPLITS=true --stacktrace

      - name: Verify signature and collect files
        run: |
          apk_dir="app/build/outputs/apk/foss/release"
          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No APK found in $apk_dir"
            exit 1
          fi

          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -n 1)"

          {
            echo "### Signed APKs"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in "${apks[@]}"; do
            # Fails the job if the APK is unsigned or the signature is broken.
            cert_sha256="$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            if [[ -z "$cert_sha256" ]]; then
              echo "::error::Could not read the signing certificate of $apk"
              exit 1
            fi
            echo "$(basename "$apk")  $cert_sha256"
            echo "- \`$(basename "$apk")\`: certificate SHA-256 \`$cert_sha256\`" >> "$GITHUB_STEP_SUMMARY"
          done

          (cd "$apk_dir" && sha256sum -- *.apk > SHA256SUMS.txt)
          echo "APK_DIR=$apk_dir" >> "$GITHUB_ENV"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-apks
          path: |
            ${{ env.APK_DIR }}/*.apk
            ${{ env.APK_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # Release notes: CHANGELOG section of this version, else [Unreleased], else GitHub's generated notes.
          section() {
            awk -v name="$1" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" name "]")) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md
          }
          section "$VERSION" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            section "Unreleased" > "$RUNNER_TEMP/notes.md"
          fi

          notes_args=(--generate-notes)
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes_args=(--notes-file "$RUNNER_TEMP/notes.md")
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          shopt -s nullglob
          files=("$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt")

          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of a failed or partial release: replace the assets.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              "${notes_args[@]}" \
              "${prerelease_args[@]}"
          fi

          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
