# Builds signed APKs and publishes them to a GitHub Release. Nothing is uploaded to Google Play.
#
# Fully automatic, nothing to tick or bump:
#   - Every push to main builds, signs and publishes a new release.
#   - Every pull request (including Dependabot's) only builds and signs, to prove the app still
#     compiles. The APKs are attached to the run as an artifact, no release is created.
#   - Actions -> "Release" -> Run workflow (on main) publishes a release from the current commit.
#   Pushes that only touch Markdown files (README, CHANGELOG, ...) or LICENSE are ignored.
#
# Numbering is automatic as well:
#   versionName  <VERSION_NAME in gradle.properties>-build.<run number>   e.g. 1.5.0-build.12
#   tag          v<versionName>                                           e.g. v1.5.0-build.12
#   versionCode  1,000,000 + 10 x minutes since 2026-01-01 (UTC)
# The versionCode only ever goes up, which is what Android needs to accept an update. It does not
# depend on VERSION_CODE in gradle.properties (that value is only used for local builds). Each
# build uses 5 consecutive codes, one per CPU architecture plus the universal APK.
# To start a new "marketing" version, change VERSION_NAME in gradle.properties.
#
# Signing: the keystore lives in the repository (release.jks + keystore.properties in the root
# folder). No repository secrets are needed. app/build.gradle.kts picks keystore.properties up
# automatically. Anyone who can read the repository can sign APKs with this key, so keep the
# repository private if that matters to you.
#
# IMPORTANT: Android only installs an update if it is signed with the SAME key as the installed
# version. Never replace release.jks, and keep a backup copy of it outside the repository.

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Pushes to main queue up one after another. A newer push to the same PR cancels the older run.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # create the tag and release, upload the assets

jobs:
  release:
    name: Build and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Work out version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow on '$DEFAULT_BRANCH' (this run is on '$GITHUB_REF_NAME')."
            exit 1
          fi

          base="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [[ -z "$base" ]]; then
            echo "::error::VERSION_NAME is missing from gradle.properties."
            exit 1
          fi

          version_name="$base-build.$GITHUB_RUN_NUMBER"
          minutes=$(( ($(date +%s) - 1767225600) / 60 )) # minutes since 2026-01-01 UTC
          version_code=$(( 1000000 + minutes * 10 ))
          if (( version_code > 2100000000 )); then
            echo "::error::versionCode $version_code is above the Android limit of 2100000000."
            exit 1
          fi

          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "tag=v$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version_name (versionCode $version_code)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check signing key
        run: |
          for file in keystore.properties release.jks; do
            if [[ ! -f "$file" ]]; then
              echo "::error::$file is missing from the repository root, so the APKs cannot be signed."
              exit 1
            fi
          done

      - name: Build release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        # ABI_SPLITS=true builds one APK per CPU architecture plus a universal APK.
        # -P overrides VERSION_NAME / VERSION_CODE from gradle.properties for this build only.
        run: |
          # The executable bit is lost when the repo is committed from some devices/zips.
          chmod +x ./gradlew
          ./gradlew assembleFossRelease -PABI_SPLITS=true \
            "-PVERSION_NAME=$VERSION_NAME" "-PVERSION_CODE=$VERSION_CODE" --stacktrace

      - name: Verify signature and collect files
        run: |
          apk_dir="app/build/outputs/apk/foss/release"
          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No APK found in $apk_dir"
            exit 1
          fi

          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -n 1)"

          {
            echo "### Signed APKs"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in "${apks[@]}"; do
            # Fails the job if the APK is unsigned or the signature is broken.
            cert_sha256="$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            if [[ -z "$cert_sha256" ]]; then
              echo "::error::Could not read the signing certificate of $apk"
              exit 1
            fi
            echo "$(basename "$apk")  $cert_sha256"
            echo "- \`$(basename "$apk")\`: certificate SHA-256 \`$cert_sha256\`" >> "$GITHUB_STEP_SUMMARY"
          done

          (cd "$apk_dir" && sha256sum -- *.apk > SHA256SUMS.txt)
          echo "APK_DIR=$apk_dir" >> "$GITHUB_ENV"

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-apks
          path: |
            ${{ env.APK_DIR }}/*.apk
            ${{ env.APK_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          {
            git log -1 --pretty=%B
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Version: $VERSION_NAME (versionCode $VERSION_CODE)"
            echo
            echo "Install \`camera-$VERSION_CODE-foss-release.apk\` (universal, works on every phone)."
            echo "The other APKs are the same app for one CPU type only."
          } > "$RUNNER_TEMP/notes.md"

          shopt -s nullglob
          files=("$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt")

          # Re-running a run that already published: replace its release instead of mixing assets.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" "${files[@]}" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
