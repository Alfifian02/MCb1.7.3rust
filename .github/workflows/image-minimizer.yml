# Shrinks large images pasted into issues, comments and pull requests (shared Fossify workflow).

name: Image Minimizer

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

jobs:
  call-image-minimizer-workflow:
    uses: FossifyOrg/.github/.github/workflows/image-minimizer.yml@main
    secrets: inherit
