# Regenerates the lint baselines and opens a PR with the result (shared Fossify workflow).

name: Update Lint Baselines

on:
  repository_dispatch:
    types: [update-lint-baselines]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month at 00:00 UTC

jobs:
  update-lint-baselines:
    uses: FossifyOrg/.github/.github/workflows/update-lint-baselines.yml@main
    secrets: inherit
