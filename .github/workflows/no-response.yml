# Closes issues that are still waiting for the reporter's reply (shared Fossify workflow).

name: No Response

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch:

jobs:
  call-no-response-workflow:
    uses: FossifyOrg/.github/.github/workflows/no-response.yml@main
    secrets: inherit
