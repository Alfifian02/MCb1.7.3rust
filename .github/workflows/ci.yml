# Berjalan di server GitHub, jadi tidak perlu PC. Hasil: tab "Actions" (tes) dan "Releases" (APK).
name: ci
on:
  push:
  workflow_dispatch:   # tombol "Run workflow" manual

permissions:
  contents: write      # untuk membuat Release berisi APK

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tes mc-core
        run: cargo test -p mc-core --all-targets 2>&1 | tail -n 200

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Pasang cargo-apk
        run: cargo install cargo-apk --locked
      - name: Siapkan SDK/NDK bawaan runner
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build APK (debug, ditandatangani kunci debug)
        working-directory: mc-android
        run: cargo apk build
      - name: Kumpulkan APK
        run: |
          ls -la target/debug/apk/
          mkdir -p dist
          cp target/debug/apk/MinecraftB173Rust.apk dist/MinecraftB173Rust.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftB173Rust-apk
          path: dist/MinecraftB173Rust.apk
      - name: Rilis (agar APK bisa diunduh langsung dari ponsel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: dist/MinecraftB173Rust.apk
