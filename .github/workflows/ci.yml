name: ci
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mc-rs-test
      - run: cargo test --message-format=short 2>&1 | tail -n 200

  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mc-rs-apk
      - name: Restore cargo-apk
        id: cache-cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-bin-v1-${{ runner.os }}
      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --locked
      - name: Env for SDK/NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      # cargo-apk writes the APK to target/<triple>/<profile>/apk/<apk_name>.apk
      # and signs it with the debug keystore (creating one at ~/.android/debug.keystore if needed).
      - name: Build APK
        working-directory: mc-rs
        run: |
          set -e
          cargo apk build 2>&1 | tail -n 120
          echo "--- looking for produced APK ---"
          find target -name '*.apk' -path '*/apk/*' -exec ls -la {} \;
      - name: Locate APK
        id: find_apk
        working-directory: mc-rs
        run: |
          set -e
          APK=$(find target -name 'MinecraftB173Rust.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find target -name '*.apk' -path '*/apk/*' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::no APK found under target/. Build step did not produce one."
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
      - name: Verify signature (debug keystore)
        id: verify
        working-directory: mc-rs
        run: |
          set -e
          APK=${{ steps.find_apk.outputs.apk }}
          APK_SIGNER=$(find "$ANDROID_HOME" -name 'apksigner' -type f | head -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "::error::apksigner not found in ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using apksigner: $APK_SIGNER"
          "$APK_SIGNER" verify --print-certs "$APK"
      - name: Collect APK
        env:
          UNSIGNED: ${{ steps.find_apk.outputs.apk }}
        run: |
          set -e
          mkdir -p dist
          cp "$UNSIGNED" dist/MinecraftB173Rust.apk
          ls -la dist/
          unzip -l dist/MinecraftB173Rust.apk | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftB173Rust-apk
          path: dist/MinecraftB173Rust.apk
      - name: Release (for direct phone install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: dist/MinecraftB173Rust.apk
