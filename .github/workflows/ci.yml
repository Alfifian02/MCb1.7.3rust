name: ci
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --message-format=short 2>&1 | tail -n 200

  apk:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Env for SDK/NDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: mc-rs
        run: cargo apk build 2>&1 | tail -n 80
      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name '*.apk' -path '*/target/*' -exec cp {} dist/MinecraftB173Rust.apk \;
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftB173Rust-apk
          path: dist/MinecraftB173Rust.apk
      - name: Release (for direct phone install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          prerelease: true
          files: dist/MinecraftB173Rust.apk
