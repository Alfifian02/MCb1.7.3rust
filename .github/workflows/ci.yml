name: ci
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dump Android SDK layout
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "--- contents of \$ANDROID_HOME ---"
          ls -la "$ANDROID_HOME" 2>&1 | head -20
          echo "--- build-tools ---"
          ls -la "$ANDROID_HOME/build-tools/" 2>&1 | head -10
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            BTVER=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)
            echo "latest build-tools version: $BTVER"
            ls -la "$ANDROID_HOME/build-tools/$BTVER/" | head -30
          fi
          echo "--- aapt? ---"
          which aapt || true
          "$ANDROID_HOME/build-tools"/*/aapt version 2>&1 | head -3 || true
          echo "--- apksigner? ---"
          which apksigner || true
          "$ANDROID_HOME/build-tools"/*/apksigner --version 2>&1 | head -3 || true
          echo "--- zipalign? ---"
          which zipalign || true
          echo "--- keytool? ---"
          which keytool || true
          keytool -help 2>&1 | head -2 || true

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mc-rs-test
      - run: cargo test --message-format=short 2>&1 | tail -n 200

  apk:
    needs: probe
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mc-rs-apk
      - name: Restore cargo-apk
        id: cache-cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-bin-v1-${{ runner.os }}
      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --locked
      - name: Build APK
        working-directory: mc-rs
        run: |
          set -e
          cargo apk build 2>&1 | tail -n 80
          echo "--- produced APKs ---"
          find target -name '*.apk' -path '*/apk/*' -exec ls -la {} \;
      - name: Locate signed APK
        id: find_apk
        working-directory: mc-rs
        run: |
          set -e
          APK=$(find target -name 'MinecraftB173Rust.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find target -name '*.apk' -path '*/apk/*' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::no APK produced"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Verify signature (apksigner)
        working-directory: mc-rs
        env:
          APK: ${{ steps.find_apk.outputs.apk }}
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; refusing to ship"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Collect APK
        env:
          UNSIGNED: ${{ steps.find_apk.outputs.apk }}
        run: |
          mkdir -p dist
          cp "$UNSIGNED" dist/MinecraftB173Rust.apk
          ls -la dist/
          unzip -l dist/MinecraftB173Rust.apk | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftB173Rust-apk
          path: dist/MinecraftB173Rust.apk
      - name: Release (for direct phone install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
        prerelease: true
        files: dist/MinecraftB173Rust.apk
