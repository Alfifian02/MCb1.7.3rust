# Lint, detekt and unit tests for every pull request (shared Fossify workflow).

name: PR Checks

on:
  pull_request:
    branches: [main]

# A newer push to the same PR cancels the run that is still in progress.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  call-pr-workflow:
    uses: FossifyOrg/.github/.github/workflows/pr.yml@main
