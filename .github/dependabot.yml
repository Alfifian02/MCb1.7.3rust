# Opens pull requests for outdated dependencies. The "Release" workflow builds every PR, so a
# green check means the update compiles. Merging a PR publishes a new release automatically.

version: 2

registries:
  maven-google:
    type: maven-repository
    url: "https://dl.google.com/dl/android/maven2/"

  maven-central:
    type: maven-repository
    url: "https://repo.maven.apache.org/maven2"

  jitpack:
    type: maven-repository
    url: "https://www.jitpack.io"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-central
      - maven-google
      - jitpack
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Minor and patch bumps (including Fossify Commons and CameraX) arrive as one PR per week.
    # Major bumps stay separate so they can be reviewed on their own.
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
