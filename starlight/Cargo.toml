[package]
name = "starlight"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Rust port of ScalableLux's (Starlight fork, 26.2.0) light engine core: queue-based light increase / decrease, stateless skylight sources, chunk edge checks, parallel light tasks on disjoint chunk windows. std only."

# No dependencies on purpose: pure CPU logic that `cargo test -p starlight` runs on a plain Linux host
# (the mc-rs cdylib cannot be tested there) and that cross-compiles to Android unchanged.
[dependencies]
