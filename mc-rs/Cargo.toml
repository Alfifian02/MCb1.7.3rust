[package]
name = "mc-rs"
version = "0.2.0"
edition = "2021"

[lib]
name = "mc_rs"
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
wgpu = { version = "26", default-features = false, features = ["vulkan", "gles", "wgsl"] }
glam = "0.27"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[package.metadata.android]
package = "dev.mcrs.b173"
apk_name = "MinecraftB173Rust"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "MC b1.7.3 Rust"
# No title/status bar, so the landscape surface is the full screen.
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# Landscape, either direction (follows the sensor, never portrait).
orientation = "sensorLandscape"
